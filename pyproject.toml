[project]
name = "vinted-tracker"
version = "0.1.0"
description = "Track Vinted listings (any brand/market) and alert on new, price-change, and sold items via Discord + a web dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexandre Girard Davila" }]

# --- Lint + format (https://docs.astral.sh/ruff/) -------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# --- Tests (https://docs.pytest.org/) -------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# --- Types (https://mypy.readthedocs.io/) ---------------------------------
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
