name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint · test · types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements-dev.txt
      - name: Ruff (format check)
        run: ruff format --check .
      - name: Ruff (lint)
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Type check (mypy)
        run: mypy poller.py ui.py

  docker:
    name: build image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vinted-tracker:ci .
